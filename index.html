<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Brainwave.io</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Rubik:wght@400;700&display=swap" rel="stylesheet">
    <link href="https://db.onlinewebfonts.com/c/1dc8ecd8056a5ea7aa7de1db42b5b639?family=Gilroy-Regular"
        rel="stylesheet">
    <link href="style.css" rel="stylesheet" type="text/css">
</head>

<body>
    <header class="header">
        <div class="header-inner">
            <a href="#" class="logo">Brainwave.io</a>
            <nav class="nav">
                <a href="#">Demos</a>
                <a href="#">Pages</a>
                <a href="#">Support</a>
                <a href="#">Contact</a>
            </nav>
            <a href="#" class="btn btn-red">Get Started Now</a>
        </div>
    </header>
    <section class="hero">
        <div class="oval oval-1"></div>
        <div class="oval oval-2"></div>
        <div class="oval oval-3"></div>

        <div class="container hero-inner">
            <div class="hero-content">
                <h1>Manage your remote team work</h1>
                <p class="hero-desc">With lots of unique blocks, you can easily build a page without coding. Build your
                    next consultancy
                    website within few minutes.</p>
                <a href="#" class="btn btn-red">Explore more</a>
                <p class="download-label">Download our app</p>
                <div class="store-badges">
                    <a href="#"><img src="assets/img/badge-app-store.png" alt="App Store"></a>
                    <a href="#"><img src="assets/img/badge-google-play.png" alt="Google Play"></a>
                </div>
            </div>

            <div class="hero-visual">
                <div class="dots" aria-hidden="true"></div>
                <img src="assets/img/hero-chat.png" alt="Team chat on mobile app" class="hero-chat">
                <img src="assets/img/hero-bubble.png" alt="" class="hero-bubble">
            </div>
        </div>

        <div class="hero-wave">
            <svg width="1600" height="224" viewBox="0 0 1600 224" xmlns="http://www.w3.org/2000/svg">
                <path
                    d="M0 85.0547C0 85.0547 228.2 199.895 384.1 190.602C540 181.309 633.391 143.004 804.696 162.156C976 181.309 1472.86 132.989 1612.8 0V223.758H0V85.0547Z"
                    fill="#FDFDFF" />
            </svg>
        </div>
    </section>
</body>

</html>
